    log(st, `${P.name} · ${c.title}: ${o.label}.`);
    event(st, { k: 'cardpick', p, id: c.id, i });
    P.card = null;
    reveal(st, p);
    return true;
  }

  // ---------- construcciones ----------
  function buildOptions(st, u) {
    if (!u || u.acted || UNITS[u.type].fly || UNITS[u.type].naval || u.hero) return [];
    const p = u.owner, t = st.tiles[idx(u.x, u.y)];
    if (cityAt(st, u.x, u.y) || buildAt(st, u.x, u.y) || nodeAt(st, u.x, u.y) || st.ruins.includes(idx(u.x, u.y))) return [];
    const city = nearestOwnCity(st, p, u.x, u.y);
    if (!city) return [];
    const coast = neighbors(u.x, u.y).some(([x, y]) => st.tiles[idx(x, y)] === 'mar');
    const mine = (st.builds || []).filter((b) => b.city === city.id);
    return Object.entries(BUILDS).filter(([k, B]) => B.on.includes(t) && (!B.coast || coast) && !(k === 'antena' && mine.some((b) => b.type === 'antena')) && mine.length < 3)
      .map(([k, B]) => { const cost = Math.round(B.cost * cityScale(st, p)); return { type: k, name: B.name, cost, desc: B.desc, can: st.players[p].scrap >= cost, city: city.name }; });
  }
  function build(st, uid, type) {
    bind(st);
    const u = st.units.find((v) => v.id === uid);
    const o = buildOptions(st, u).find((x) => x.type === type);
    if (!o || !o.can || u.owner !== st.cur) return false;
    const city = nearestOwnCity(st, u.owner, u.x, u.y);
    st.players[u.owner].scrap -= o.cost;
    st.builds.push({ x: u.x, y: u.y, type, owner: u.owner, city: city.id });
    u.acted = true; u.moved = true;
    st.players[u.owner].stats.builds = (st.players[u.owner].stats.builds || 0) + 1;
    log(st, `${st.players[u.owner].name} levantó ${BUILDS[type].name} cerca de ${city.name}.`);
    event(st, { k: 'build', p: u.owner, x: u.x, y: u.y, type });
    reveal(st, u.owner);
    return true;
  }
  // saqueo: una unidad enemiga que entra destruye la construcción y cobra 2
  function pillage(st, u) {
    const b = buildAt(st, u.x, u.y);
    if (!b || b.owner === u.owner || allied(st, b.owner, u.owner)) return;
    st.builds.splice(st.builds.indexOf(b), 1);
    st.players[u.owner].scrap += 2;
    log(st, `${st.players[u.owner].name} saqueó ${BUILDS[b.type].name} de ${st.players[b.owner].name}.`);
    event(st, { k: 'pillage', p: u.owner, x: u.x, y: u.y, type: b.type });
  }

  // ---------- habilidad del líder ----------
  function canHeroAbility(st, u) { return !!u && u.hero && u.owner === st.cur && !(u.cd > 0) && !u.acted; }
  function heroAbility(st, uid) {
    bind(st);
    const u = st.units.find((v) => v.id === uid);
    if (!canHeroAbility(st, u)) return false;
    const p = u.owner, H = HERO[fac(st, p)];
    let n = 0;
    for (const v of st.units) if (v.owner === p && v !== u && dist(v.x, v.y, u.x, u.y) <= 2) {
      n++; const b0 = v.hp; v.hp = Math.min(maxHp(v), v.hp + H.heal);
      const coastal = st.tiles[idx(v.x, v.y)] === 'mar' || neighbors(v.x, v.y).some(([nx, ny]) => st.tiles[idx(nx, ny)] === 'mar');
      if (H.move && (!H.coastOnly || coastal)) v.moved = false;
      if (H.act) v.acted = false;
      event(st, { k: 'buff', x: v.x, y: v.y, kind: H.move || H.act ? 'move' : 'heal', v: v.hp - b0 });
    }
    if (H.blast) for (const e of enemiesNear(st, p, u.x, u.y, 1)) { e.hp -= H.blast; event(st, { k: 'hit', x: e.x, y: e.y, v: H.blast, ax: u.x, ay: u.y, atype: 'mortero', aid: u.id, did: e.id }); if (e.hp <= 0) killUnit(st, e, p); }
    if (H.energy) st.players[p].energy += H.energy;
    if (H.scrap) st.players[p].scrap += H.scrap;
    u.cd = 4; u.acted = true;
    log(st, `${u.name || 'El líder'}: ${H.name}.`);
    event(st, { k: 'hero', p, x: u.x, y: u.y, name: H.name, n });
    return true;
  }

  // ---------- protocolos (poderes) ----------
  function canPower(st, p, k) {
    const P = st.players[p], Pw = POWERS[k];
    return !!Pw && !P.usedPower && (P.energy || 0) >= Pw.cost && st.cur === p;
  }
  function usePower(st, p, k, x, y) {
    bind(st);
    if (!canPower(st, p, k)) return false;
    const P = st.players[p];
    if (k === 'tormenta') {
      if (x == null || !visibleSet(st, p).has(idx(x, y))) return false;
      const cells = [[x, y], ...neighbors(x, y)];
      for (const u of st.units.slice()) if (cells.some(([cx, cy]) => cx === u.x && cy === u.y)) { u.hp -= 6; event(st, { k: 'hit', x: u.x, y: u.y, v: 6 }); if (u.hp <= 0) { killUnit(st, u, p); if (u.owner !== p) { P.kills++; } } }
      event(st, { k: 'storm', x, y });
    } else if (k === 'marcha') {
      for (const u of st.units) if (u.owner === p) { u.moved = false; u.acted = false; event(st, { k: 'buff', x: u.x, y: u.y, kind: 'move' }); }
    } else if (k === 'condor') {
      P.reveal = 2; reveal(st, p);
    } else if (k === 'rescate') {
      for (const u of st.units) if (u.owner === p) { const b = u.hp; u.hp = Math.min(maxHp(u), u.hp + 8); event(st, { k: 'buff', x: u.x, y: u.y, kind: 'heal', v: u.hp - b }); }
    } else if (k === 'pulso') {
      const nd = nodeAt(st, x, y);
      if (!nd || nd.owner !== p || nd.blocked) return false;
      for (const u of st.units.slice()) if (u.owner !== p && !allied(st, u.owner, p) && dist(u.x, u.y, x, y) <= 2) { u.hp -= 10; event(st, { k: 'hit', x: u.x, y: u.y, v: 10 }); if (u.hp <= 0) { killUnit(st, u, p); P.kills++; } }
      nd.blocked = 3; event(st, { k: 'storm', x, y });
    }
    P.energy -= POWERS[k].cost; P.usedPower = true; P.stats.powers++;
    log(st, `${P.name} activó ${POWERS[k].name}.`);
    event(st, { k: 'power', p, name: k });
    reveal(st, p);
    checkWin(st);
    return true;
  }

  function score(st, p) {
    let s = 0;
    for (const c of st.cities) if (c.owner === p) s += 100 * c.level + (c.capital ? 100 : 0);
    for (const u of st.units) if (u.owner === p) s += 10 * UNITS[u.type].cost;
    s += 40 * st.players[p].techs.length + 20 * st.players[p].kills;
    return s;
  }
  function power(st, p) {
    return st.units.filter((u) => u.owner === p).reduce((a, u) => a + UNITS[u.type].cost * (u.hp / maxHp(u)), 0)
      + st.cities.filter((c) => c.owner === p).length * 3;
  }

  function checkElim(st, p) {
    const P = st.players[p];
    if (!P.alive || P.horde) return;
    if (!st.cities.some((c) => c.owner === p)) {
      P.alive = false;
      st.units = st.units.filter((u) => u.owner !== p);
      st.offers = st.offers.filter((o) => o.from !== p && o.to !== p);
      log(st, `${P.name} ha sido eliminado.`);
      event(st, { k: 'elim', p });
    }
  }
  function checkWin(st) {
    if (st.winner >= 0) return;
    const alive = alivePlayers(st);
    const ob = st.objective;
    if (ob) {
      if (ob.type === 'capture') {
        const c = st.cities.find((cc) => cc.name === ob.city);
        if (c && c.owner === ob.player) { st.winner = ob.player; st.winText = `Tomaste ${c.name}.`; return; }
      }
      if (ob.type === 'cities') {
        const n = st.cities.filter((c) => c.owner === ob.player).length;
        if (n >= ob.n) { st.winner = ob.player; st.winText = `Controlas ${n} ciudades.`; return; }
      }
      if (ob.type === 'eliminate') {
        const t = st.players.findIndex((P) => P.faction === ob.faction);
        if (t >= 0 && !st.players[t].alive) { st.winner = ob.player; st.winText = `${st.players[t].name} ha caído.`; return; }
      }
      if (ob.type === 'coopnodes') {
        const n = (st.nodes || []).filter((nd) => nd.owner >= 0 && !st.players[nd.owner].horde).length;
        if (n >= ob.n) { st.winner = ob.player; st.winText = `Controlan ${n} nodos del Inti.`; return; }
      }
      if (ob.type === 'killboss') {
        if (!st.units.some((u) => u.boss)) { st.winner = ob.player; st.winText = 'El Apu de acero ha caído.'; return; }
      }
      if (ob.type === 'survive') {
        const cap = st.cities.find((c) => c.capital && c.name === FACTIONS[st.players[ob.player].faction].capital);
        if (cap && cap.owner !== ob.player) { const w = cap.owner >= 0 ? cap.owner : (alive.find((i) => i !== ob.player) ?? 0); st.winner = w; st.winText = 'Perdiste tu capital.'; return; }
      }
      if (!st.players[ob.player].alive) { st.winner = alive[0] ?? 0; st.winText = 'Fuiste eliminado.'; return; }
    }
    if (alive.length === 1) { st.winner = alive[0]; st.winText = 'Último en pie.'; return; }
    if (st.players.some((P) => P.kind === 'human') && !st.players.some((P) => P.kind === 'human' && P.alive)) {
      const best = alive.reduce((a, b) => (score(st, a) >= score(st, b) ? a : b));
      st.winner = best; st.winText = 'Todos los comandantes humanos cayeron.'; return;
    }
    const allAllied = alive.every((a) => alive.every((b) => a === b || allied(st, a, b)));
    if (allAllied && alive.length > 1) {
      const best = alive.reduce((a, b) => (score(st, a) >= score(st, b) ? a : b));
      st.winner = best; st.winText = 'Victoria de la alianza. ' + st.players[best].name + ' lidera el nuevo Perú.';
    }
  }
  function finishByScore(st) {
    const alive = alivePlayers(st);
    const ob = st.objective;
    if (ob && ob.type !== 'survive') { st.winner = alive.find((i) => i !== ob.player) ?? ob.player; st.winText = 'Se acabó el tiempo sin cumplir el objetivo.'; return; }
    const best = alive.reduce((a, b) => (score(st, a) >= score(st, b) ? a : b));
    st.winner = best; st.winText = 'Se acabó el tiempo. Ganó por puntos.';
  }

  // ---------- consejo de investigación ----------
  function adviseTech(st, p) {
    const P = st.players[p];
    const has = (t) => P.techs.includes(t);
    const cities = st.cities.filter((c) => c.owner === p).length;
    const myUnits = st.units.filter((u) => u.owner === p);
    const ranged = myUnits.some((u) => UNITS[u.type].rng > 1);
    const threat = st.units.some((e) => e.owner !== p && relation(st, p, e.owner) === 'guerra' && st.cities.some((c) => c.owner === p && dist(e.x, e.y, c.x, c.y) <= 2));
    const order = [];
    if (threat && !has('murallas')) order.push(['murallas', 'Hay enemigos cerca de tus ciudades.']);
    if (!ranged && !has('armeria') && !UNITS[FACTIONS[P.faction].unique].rng > 1) order.push(['armeria', 'No tienes unidades de alcance.']);
    if (cities >= 3 && !has('mercado')) order.push(['mercado', `Con ${cities} ciudades, Mercado paga solo.`]);
    if (!has('taller')) order.push(['taller', 'El Tanque Chatarra rompe cualquier defensa.']);
    if (!has('medicina')) order.push(['medicina', 'Curar el doble ahorra tropas.']);
    if (has('mercado') && !has('chatarreria')) order.push(['chatarreria', 'Más chatarra por ruina y mejoras baratas.']);
    if (has('armeria') && !has('artilleria')) order.push(['artilleria', 'El Mortero golpea desde 3 casillas.']);
    if (has('taller') && !has('drones')) order.push(['drones', 'Los drones cruzan mar y montaña.']);
    if (has('taller') && has('artilleria') && !has('apu')) order.push(['apu', 'El Mecha Apu decide la partida.']);
    for (const t of Object.keys(TECHS)) if (!has(t)) order.push([t, TECHS[t].desc]);
    const next = order.find(([t]) => !has(t) && techReqsMet(st, p, t));
    return next ? { tech: next[0], why: next[1], can: canResearch(st, p, next[0]) } : null;
  }

  // ---------- IA ----------
  // dificultad: facil (pasiva y torpe), normal, dificil (ingresos +1, prevé, defiende, usa protocolos)
  // dificultad: fácil es de verdad relajada; locura es solo para expertos
  // doctrinas: no cambian la fuerza, cambian el carácter (y así el jugador aprende a temer a cada líder por algo distinto)
  const AI_DOCTRINE = {
    lima:     { assault: 1.5, expand: 0, ruins: 0, name: 'Protocolo', desc: 'Fortifica y espera. Golpea cuando tiene superioridad.' },
    sierra:   { assault: 1, expand: 0, ruins: 0, name: 'Cumbre', desc: 'Defiende la montaña y castiga a quien sube.' },
    selva:    { assault: -0.5, expand: 0.5, ruins: 0, name: 'Emboscada', desc: 'Ataca desde la selva y se repliega.' },
    desierto: { assault: 0, expand: -0.5, ruins: -1.5, name: 'Saqueo', desc: 'Va por ruinas y ciudades débiles. No la dejes suelta.' },
    culto:    { assault: -1.5, expand: 0, ruins: 0, name: 'Marcha', desc: 'Se lanza en masa, sin medir pérdidas.' },
    flota:    { assault: 0, expand: -1, ruins: 0, name: 'Litoral', desc: 'Toma toda la costa antes que nadie.' },
    callao:   { assault: -0.5, expand: -0.5, ruins: 0, name: 'Marea', desc: 'Sale del mar donde menos lo esperas.' },
    chasquis: { assault: 0, expand: -1, ruins: -0.5, name: 'Relevo', desc: 'Corre por los caminos y se expande rápido.' },
    mineros:  { assault: 0.5, expand: -0.5, ruins: -1, name: 'Socavón', desc: 'Acumula metal y mejora ciudades antes de pelear.' },
  };
  const DIFF = {
    facil:   { name: 'Fácil',   bonus: 0, malus: 0.35, look: 1, retreat: 0.55, passiveUntil: 10, techChance: 0.2, betray: 0.05, attackMin: 0.6, trainSkip: 0.45, noAlly: false, desc: 'La IA se lo toma con calma: ataca poco, entrena lento y no te asalta la capital antes del turno 10.' },
    normal:  { name: 'Normal',  bonus: 0, malus: 0, look: 2, retreat: 0.4, passiveUntil: 0, techChance: 0.5, betray: 0.25, attackMin: 0, trainSkip: 0, desc: 'Juego parejo: la IA expande, pacta y traiciona como un jugador medio.' },
    dificil: { name: 'Difícil', bonus: 1, malus: 0, look: 2, retreat: 0.4, passiveUntil: 0, techChance: 0.7, betray: 0.4, attackMin: 0, trainSkip: 0, atkBoost: 0.05, desc: 'La IA recibe chatarra extra, +5% de ataque, investiga más rápido y va a por tu capital desde el inicio.' },
    locura:  { name: 'Locura',  bonus: 2, malus: 0, look: 3, retreat: 0.45, passiveUntil: 0, techChance: 0.9, betray: 0.5, attackMin: 0, trainSkip: 0, extraTrain: 1, allSee: true, atkBoost: 0.15, desc: 'Solo expertos: ve todo el mapa, entrena una tropa extra por ciudad, +15% de ataque, el doble de chatarra extra y traiciona sin dudar.' },
  };
  const diffOf = (P) => DIFF[P.diff] || DIFF.normal;
  function leaderPower(st, p) { return Math.max(...st.players.map((Q, i) => (Q.alive && i !== p && !Q.horde ? power(st, i) : 0)), 1); }
  function enemiesNear(st, p, x, y, r) { return st.units.filter((e) => e.owner !== p && relation(st, p, e.owner) === 'guerra' && dist(e.x, e.y, x, y) <= r); }
  function losing(st, p) {
    const cities = st.cities.filter((c) => c.owner === p).length;
    const cap = st.cities.find((c) => c.owner === p && c.capital);
    const capThreat = cap ? enemiesNear(st, p, cap.x, cap.y, 2).length : 0;
    return (cities <= 2 && capThreat >= 2) || power(st, p) < leaderPower(st, p) * 0.4 && cities <= 3;
  }
  // último recurso: una vez por partida, cuando está contra las cuerdas
  function lastStand(st, p) {
    const P = st.players[p];
    if (P.lastStand || P.horde) return false;
    const cap = st.cities.find((c) => c.owner === p && c.capital) || st.cities.find((c) => c.owner === p);
    if (!cap) return false;
    P.lastStand = true;
    const f = P.faction, F = FACTIONS[f];
    const kinds = { lima: 'protocolo', sierra: 'muralla', selva: 'emboscada', desierto: 'tormenta', culto: 'martirio', flota: 'desembarco', callao: 'marejada', chasquis: 'relevo', mineros: 'derrumbe' };
    const kind = kinds[f] || 'refuerzos';
    for (const u of st.units) if (u.owner === p) { u.hp = maxHp(u); if (!u.vet) { u.vet = true; u.hp = maxHp(u); } }
    const free = () => [[cap.x, cap.y], ...neighbors(cap.x, cap.y)].filter(([x, y]) => !unitAt(st, x, y) && passable(st, 'rondero', p, x, y));
    const n = f === 'culto' ? 4 : 2;
    for (let k = 0; k < n; k++) { const sp = free(); if (!sp.length) break; const [x, y] = pick(st, sp); const t = f === 'culto' ? 'fanatico' : f === 'flota' ? 'lancha' : f === 'callao' ? 'triton' : f === 'chasquis' ? 'chasqui' : f === 'mineros' ? 'barrenero' : f === 'sierra' ? 'huaracero' : f === 'lima' ? 'vigia' : f === 'selva' ? 'jaguar' : f === 'desierto' ? 'buggy' : 'rondero'; const u = spawn(st, p, t, x, y); u.vet = true; u.hp = maxHp(u); u.moved = false; u.acted = false; }
    if (f === 'sierra') { if (!P.techs.includes('murallas')) P.techs.push('murallas'); if (!P.techs.includes('bunker')) P.techs.push('bunker'); }
    if (f === 'lima') P.energy = (P.energy || 0) + 4;
    if (f === 'desierto') { for (const e of enemiesNear(st, p, cap.x, cap.y, 2)) { e.hp -= 6; event(st, { k: 'hit', x: e.x, y: e.y, v: 6 }); if (e.hp <= 0) killUnit(st, e, p); } }
    if (f === 'selva') for (const u of st.units) if (u.owner === p) { u.moved = false; u.acted = false; }
    if (f === 'culto') P.betrayed = -1;
    if (f === 'chasquis') for (const u of st.units) if (u.owner === p) u.moved = false;
    if (f === 'mineros') { P.scrap += 10; for (const c of st.cities) if (c.owner === p && c.level < 4) c.level++; }
    P.scrap += 6;
    const msgs = { protocolo: 'abre las puertas del búnker: androides y energía de reserva', muralla: 'levanta murallas de emergencia y refuerza las cumbres', emboscada: 'desata una emboscada: la selva entera se mueve', tormenta: 'detona cargas de chatarra alrededor de su capital', martirio: 'convoca a los últimos peregrinos al martirio', desembarco: 'desembarca su última flota', marejada: 'llama a la marejada: los tritones salen del mar', relevo: 'manda el último relevo: todos los caminos del norte se llenan de corredores', derrumbe: 'dinamita el socavón: metal para todos y ciudades reforzadas' };
    log(st, `¡ÚLTIMO RECURSO! ${P.name} ${msgs[kind]}.`);
    event(st, { k: 'laststand', p, kind, x: cap.x, y: cap.y });
    return true;
  }

  const desperateFor = (st, p) => losing(st, p);
  function aiTurn(st) {
    bind(st);
    const p = st.cur, P = st.players[p];
    const D = diffOf(P);
    if (D.bonus && !P.horde) P.scrap += D.bonus * Math.max(1, Math.round(st.cities.filter((c) => c.owner === p).length / 2));
    if (D.malus && !P.horde) P.scrap = Math.max(0, P.scrap - Math.floor(income(st, p) * D.malus)); // fácil: pierde parte de lo que produce
    if (P.card) { const c = CARDS.find((x) => x.id === P.card.id); chooseCard(st, p, desperateFor(st, p) && c.id === 'tregua' ? 0 : (c.ai ?? 0)); }
    const desperate = !P.horde && losing(st, p);
    if (desperate && !P.lastStand) lastStand(st, p);
    // --- diplomacia ---
    for (const o of st.offers.filter((oo) => oo.to === p)) answer(st, o.from, p, desperate ? true : aiAccepts(st, o.from, p));
    const leader = st.players.map((Q, i) => i).filter((i) => i !== p && st.players[i].alive && !st.players[i].horde).sort((a, b) => power(st, b) - power(st, a))[0];
    if (st.players.length > 2 && P.traitor === 0 && (rng(st) < 0.15 || (desperate && rng(st) < 0.6))) {
      // prefiere aliarse contra el más fuerte: elige al segundo más fuerte o a quien esté lejos
      const cand = st.players.map((_, i) => i).filter((i) => canAlly(st, p, i) && st.players[i].traitor === 0 && (desperate || i !== leader || st.players.length <= 3));
      if (cand.length) {
        const q = cand.sort((a, b) => power(st, b) - power(st, a))[desperate ? 0 : Math.min(cand.length - 1, 1)] ?? cand[0];
        if (st.players[q].kind === 'ai') answer(st, p, q, rng(st) < 0.5); else propose(st, p, q);
      }
    }
    for (let q = 0; q < st.players.length; q++) {
      if (q === p || !allied(st, p, q) || st.turn < 8) continue;
      const weak = power(st, q) < power(st, p) * 0.55;
      const juicy = st.units.some((u) => u.owner === p && !u.moved && st.cities.some((c) => c.owner === q && dist(u.x, u.y, c.x, c.y) <= 1 && !unitAt(st, c.x, c.y)));
      if ((weak || juicy) && rng(st) < D.betray) betray(st, p, q);
    }
    const passive = st.turn < D.passiveUntil;
    // --- protocolos ---
    if (!P.horde && (P.energy || 0) >= 1) {
      const vis = visibleSet(st, p);
      const hurt = st.units.filter((u) => u.owner === p && u.hp < maxHp(u) * 0.5).length;
      const enemies = st.units.filter((e) => e.owner !== p && relation(st, p, e.owner) === 'guerra' && vis.has(idx(e.x, e.y)));
      let best = null, bestN = desperate ? 0.5 : 1;
      for (const e of enemies) { const n = enemies.filter((f) => dist(f.x, f.y, e.x, e.y) <= 1).length - st.units.filter((u) => u.owner === p && dist(u.x, u.y, e.x, e.y) <= 1).length * 1.2; if (n > bestN) { bestN = n; best = e; } }
      const myNode = (st.nodes || []).find((nd) => nd.owner === p && !nd.blocked && enemiesNear(st, p, nd.x, nd.y, 2).length >= 2);
      if (best && st.turn < 5 && !D.bonus && cityAt(st, best.x, best.y) && cityAt(st, best.x, best.y).capital) best = null;
      if (myNode && canPower(st, p, 'pulso')) usePower(st, p, 'pulso', myNode.x, myNode.y);
      else if (best && canPower(st, p, 'tormenta')) usePower(st, p, 'tormenta', best.x, best.y);
      else if (hurt >= (desperate ? 2 : 3) && canPower(st, p, 'rescate')) usePower(st, p, 'rescate');
      else if (canPower(st, p, 'marcha') && (P.energy >= 5 || desperate)) usePower(st, p, 'marcha');
      else if (D.bonus && canPower(st, p, 'condor') && P.energy >= 4 && st.turn % 5 === 0) usePower(st, p, 'condor');
    }
    // --- líder ---
    for (const h of st.units.filter((u) => u.owner === p && u.hero)) { const near = st.units.filter((v) => v.owner === p && v !== h && dist(v.x, v.y, h.x, h.y) <= 2); if (canHeroAbility(st, h) && (near.filter((v) => v.hp < maxHp(v) * 0.7).length >= 2 || (desperate && near.length))) heroAbility(st, h.id); }
    // --- unidades ---
    const myCities = () => st.cities.filter((c) => c.owner === p);
    const threatened = (c) => enemiesNear(st, p, c.x, c.y, D.look).length;
    const mine = st.units.filter((u) => u.owner === p).sort((a, b) => UNITS[b.type].rng - UNITS[a.type].rng || b.hp - a.hp);
    for (const u of mine) {

        const f = forecast(st, u, best);

        if (D.attackMin && !f.kills && !desperate && f.dmg < f.ret * (1 + D.attackMin) && !(cityAt(st, best.x, best.y) && cityAt(st, best.x, best.y).owner === p)) return false; // fácil: solo ataca si claramente gana
        if (u.hero && !f.kills && (f.ret > 0 && u.hp - f.ret < maxHp(u) * 0.6) && !desperate) return false;

    const coastalCity = (c) => neighbors(c.x, c.y).some(([nx, ny]) => st.tiles[idx(nx, ny)] === 'mar');

    const myBoats = myUnits.filter((u) => UNITS[u.type].naval).length;

let actx = null, noiseBuf = null;
function audio() {

}
// nota: freq, dur, tipo, volumen, retardo, deslizamiento final
function tone(f, dur, type = 'square', vol = 0.06, at = 0, slide) {
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(f, t);

  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.12, at = 0, lp = 1200) {

  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(lp, t); f.frequency.exponentialRampToValueAtTime(120, t + dur);

  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur + 0.02);
}

function onTap(sx, sy) {
  if (!S || S.winner >= 0 || endLock) return;
  Net.logEvent('first_tap');
  const h = pickHex(sx, sy);
  if (!h) { setSel(null); return; }
  const [x, y] = h, k = E.idx(x, y);
  const vis = E.visibleSet(S, me);
  if (powerMode) {
    const pm = powerMode; powerMode = null;
    if (E.usePower(S, me, pm, x, y)) { afterAction(); renderHud(); } else toast(pm === 'pulso' ? 'Elige un nodo que controles y no esté bloqueado.' : 'Elige una casilla que puedas ver.', 'red');
    renderPowerBar();
    return;
  }
  const su = sel && sel.kind === 'unit' ? S.units.find((u) => u.id === sel.id) : null;
  if (su && su.owner === me && isMyTurn()) {
    const tgt = E.targets(S, su).find((t) => t.x === x && t.y === y);
    if (tgt) {
      if (E.relation(S, me, tgt.owner) === 'alianza') { toast('Es tu aliado. Para atacarlo primero rompe la alianza en Diplomacia.'); return; }
      if (pendingTarget === tgt.id) { doAttack(su, tgt); return; }
      pendingTarget = tgt.id; beep('tap'); renderSheet(); return;
    }
    if (E.reachable(S, su).has(k)) { doMove(su, x, y); return; }
  }
  pendingTarget = null;
  const u = E.unitAt(S, x, y), c = E.cityAt(S, x, y);
  if (!u && !c && S.players[me].seen[k] === '1') { setSel({ kind: 'tile', x, y }); return; }
  if (u && vis.has(k)) {
    if (sel && sel.kind === 'unit' && sel.id === u.id && c) setSel({ kind: 'city', id: c.id });
    else setSel({ kind: 'unit', id: u.id });
  } else if (c && S.players[me].seen[k] === '1') setSel({ kind: 'city', id: c.id });
  else setSel(null);
}

// fondo animado del menú: Lima en ruinas bajo el Inti que cae
let bgOn = false;
const bgParts = Array.from({ length: 46 }, (_, i) => ({ x: Math.random(), y: Math.random(), v: 0.0006 + Math.random() * 0.0012, s: Math.random() < 0.2 ? 2 : 1 }));
function startBg() { if (bgOn) return; bgOn = true; requestAnimationFrame(drawBg); }
function drawBg(now) {
  if ($('#screen').hidden) { bgOn = false; return; }
  requestAnimationFrame(drawBg);
  const c = $('#bg'), W = 160, H = Math.max(200, Math.round(160 * c.clientHeight / Math.max(1, c.clientWidth)));
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  const g = c.getContext('2d');
  const px = (col, x, y, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), w, h); };
  const hz = Math.round(H * 0.5);
  // cielo en bandas con tramado
  const sky = ['#140c16', '#1e1020', '#2c1422', '#431a22', '#642622', '#8c3a22', '#b85326', '#d8732e'];
  for (let y = 0; y < hz; y++) {
    const t = (y / hz) * (sky.length - 1), i = Math.floor(t), f = t - i;
    for (let x = 0; x < W; x++) px(f > bay(x, y) && i < sky.length - 1 ? sky[i + 1] : sky[i], x, y);
  }
  // estrellas
  for (let i = 0; i < 30; i++) { const x = hash(i, 1) * W, y = hash(i, 2) * hz * 0.5; if ((Math.floor(now / 500) + i) % 7) px('#6b5a6a', x, y); }
  // el Inti cayendo
  const ix = Math.round(W * 0.72), iy = Math.round(hz * 0.32);
  for (let k = 0; k < 40; k++) { const tx = ix + k * 1.6, ty = iy - k * 1.1; px(k < 8 ? '#ffe08a' : k < 20 ? '#e8862e' : '#8c3a22', tx, ty, 2, 2); if (hash(k, Math.floor(now / 120)) < 0.3) px('#ffe08a', tx + 2, ty - 2); }
  for (let y = -9; y <= 9; y++) for (let x = -9; x <= 9; x++) {
    const d = x * x + y * y; if (d > 81) continue;
    px(d < 25 ? (x + y < -3 ? '#fff2c4' : '#ffe08a') : d < 56 ? '#f2b84b' : '#b8741f', ix + x, iy + y);
  }
  if (Math.floor(now / 200) % 2) for (let k = 0; k < 6; k++) px('#ffe08a', ix + (hash(k, Math.floor(now / 200)) - 0.5) * 30, iy + (hash(k, 9 + Math.floor(now / 200)) - 0.5) * 30);
  // Andes lejanos
  for (let x = 0; x < W; x++) {
    const m = Math.round(hz - 18 - 14 * Math.abs(Math.sin(x * 0.05 + 1)) - 6 * Math.abs(Math.sin(x * 0.17)));
    for (let y = m; y < hz; y++) px(y < m + 3 && Math.sin(x * 0.05 + 1) > 0.6 ? '#9a8a96' : '#2a1626', x, y);
  }
  for (let x = 0; x < W; x++) { const m = Math.round(hz - 6 - 8 * Math.abs(Math.sin(x * 0.09 + 3))); for (let y = m; y < hz; y++) px('#1d1018', x, y); }
  // suelo
  px('#110e0c', 0, hz, W, H - hz);
  // horizonte de Lima en ruinas
  let x = 0, i = 0;
  while (x < W) {
    const bw = 6 + Math.floor(hash(i, 5) * 10), bh = 10 + Math.floor(hash(i, 6) * 34);
    const top = hz + 4 - bh;
    px('#0d0b0a', x, top, bw, H);
    for (let k = 0; k < bw; k++) if (hash(i, k + 20) < 0.4) px(sky[3], x + k, top, 1, 1 + Math.floor(hash(i, k) * 3));
    for (let wy = top + 3; wy < hz; wy += 3) for (let wx = x + 1; wx < x + bw - 1; wx += 2) {
      const lit = hash(i * 31 + wx, wy) < 0.09; if (lit) px(Math.floor(now / 900 + wx) % 9 ? '#f2b84b' : '#b8741f', wx, wy);
    }
    if (hash(i, 8) < 0.25) { px('#0d0b0a', x + 2, top - 8, 1, 8); if (Math.floor(now / 600 + i) % 2) px('#e5533d', x + 2, top - 9); }
    x += bw + (hash(i, 7) < 0.3 ? 2 : 0); i++;
  }
  // ceniza
  for (const p of bgParts) {
    p.y += p.v; p.x -= p.v * 0.4; if (p.y > 1) { p.y = 0; p.x = Math.random(); } if (p.x < 0) p.x = 1;
    px(p.s > 1 ? '#8a8079' : '#5a5049', p.x * W, p.y * H, p.s, p.s);
  }
}

  const sg = E.weeklySignal(), F = E.FACTIONS[sg.faction];
  const played = store.get('signal:' + sg.id, null);
  show(`<button class="back" data-a="back">‹ Volver</button><div class="brief">Transmisión semanal · origen: ${esc(sg.origin)}</div><div class="h2" style="color:#ffd45a">La Señal del Inti · ${sg.id}</div>
    <div class="facinfo box" style="--fc:${F.color}"><div class="facinfo-top"><span data-por="${sg.faction}" data-size="48"></span><div><b>${esc(F.name)}</b><small>Mapa ${esc(E.MAPS[sg.map].name)} · ${sg.rivals} rivales en Normal · ${sg.turns} turnos</small></div></div>
      <div class="chips-s">${sg.mods.map((m) => `<span class="chip-s hot">${esc(E.MODS[m].name)}</span>`).join('')}</div>
      <p>Misma semilla para todos los comandantes del mundo. Al terminar el turno ${sg.turns} se cuenta tu puntaje: ciudades, tropas, tecnologías y bajas.</p></div>
    ${played ? `<div class="status-grid"><div class="stile box"><span data-spr="i_trophy" data-col="#ffd45a" data-size="22"></span><b>${played.score}</b><small>tu mejor puntaje</small></div><div class="stile box"><span data-spr="flag" data-col="#ffd45a" data-size="22"></span><b>${played.tries || 1}</b><small>intentos</small></div></div>` : ''}
    <button class="menu-btn btn-gold" data-a="play"><div><b>${played ? 'Volver a intentar' : 'Responder a la señal'}</b><small>Mismo mapa, misma suerte: solo cuenta tu estrategia</small></div><span class="arrow">›</span></button>
    <div class="label">Tabla de la semana</div><div id="sigBoard"><p class="muted">Cargando…</p></div>`,
  (a) => { if (a === 'back') mainMenu(); if (a === 'play') startSignal(sg); });
  try {
    const k = await Net.init(); const rows = k === 'supabase' ? await Net.signalBoard(sg.id) : [];
    const el = $('#sigBoard'); if (!el) return;
    el.innerHTML = rows.length ? `<div class="scores">${rows.map((r, i) => `<div class="scorerow ${r.uid === Net.uid() ? 'me' : ''}" style="--fc:#ffd45a"><span class="pos">${i + 1}</span><span data-por="${r.faction || sg.faction}" data-size="28"></span><span class="nm">${esc(r.name || '?')}</span><span class="bar"><i style="width:${Math.round(r.score / rows[0].score * 100)}%"></i></span><b>${r.score}</b></div>`).join('')}</div>` : '<p class="muted">Nadie ha respondido todavía esta semana. Sé el primero.</p>';
    hydrate(el);
  } catch (e) { console.error(e); const el = $('#sigBoard'); if (el) el.innerHTML = '<p class="muted">Sin conexión: la tabla aparece cuando haya internet.</p>'; }
}
function startSignal(sg) {
  const others = E.FACTION_KEYS.filter((k) => k !== sg.faction);
  let r = sg.seed; const nx = () => { r = (r * 1664525 + 1013904223) >>> 0; return r / 4294967296; };
  const rivals = []; while (rivals.length < sg.rivals) { const k = others[Math.floor(nx() * others.length)]; if (!rivals.includes(k)) rivals.push(k); }
  const st = E.newGame({ mode: 'signal', size: 'pequeno', gameMode: 'clasico', mods: sg.mods, map: sg.map, seed: sg.seed, maxTurns: sg.turns, players: [{ name: playerName(), faction: sg.faction, kind: 'human' }, ...rivals.map((k) => ({ name: LEADERS[k], faction: k, kind: 'ai', diff: 'normal' }))] });
  st.signal = sg.id; st.mapCode = sg.id;
  loadGame(st, 0);
  flash('LA SEÑAL ' + sg.id, sg.turns + ' turnos · misma semilla para todos', '#ffd45a');
}
function startLocal(f, n, size, gameMode, mods, diff, mapOpts = {}) {
  const others = E.FACTION_KEYS.filter((k) => k !== f).sort(() => Math.random() - 0.5).slice(0, n - 1);
  const code = mapOpts.code || randomCode();
  const st = E.newGame({ mode: 'skirmish', size, gameMode, mods, map: mapOpts.map, seed: seedFromCode(code), players: [{ name: playerName(), faction: f, kind: 'human' }, ...others.map((k) => ({ name: LEADERS[k], faction: k, kind: 'ai', diff: diff || 'normal' }))] });
  st.mapCode = code;
  if (perkActive('relic1')) st.players[0].scrap += 1;
  if (perkActive('relic2')) st.players[0].energy += 1;
  if (perkActive('relic3')) st.players[0].relic3 = true;
  loadGame(st, 0);
}

  hydrate(c); c.hidden = false; c.classList.add('talk'); typeInto(c.querySelector('p'), L[kind], c.querySelector('canvas'));

  setTimeout(() => { if (!tut && $('#tipOk') && !c.hidden) c.hidden = true; }, 7000);

    <button class="menu-btn box press" data-a="invite"><div><b>Invitar a un amigo</b><small>Comparte el enlace con el código ${esc(g.code)} ya puesto</small></div><span class="arrow">›</span></button>

    ${host ? `<button class="menu-btn btn-gold" data-a="start"><div><b>Empezar partida</b><small>${humans} humano${humans === 1 ? '' : 's'} · los asientos libres serán IA</small></div><span class="arrow">›</span></button>` : '<p class="muted">Esperando a que el anfitrión empiece… Puedes cambiar tu facción mientras tanto.</p>'}
    ${'Notification' in window && Notification.permission === 'default' ? '<button class="menu-btn box press" data-a="notif"><div><b>Avisarme cuando sea mi turno</b><small>Activa las notificaciones del navegador</small></div><span class="arrow">›</span></button>' : ''}`,
  async (a, d) => {

}
let pushing = false, pushAgain = false;

  if (!online || !S) return;

    const copy = { ...S }; delete copy._shown;
    copy.replay = { by: me, ev: replayAcc.slice(-300) };
    if (final) replayAcc = [];

    try { await Net.update(online.code, patch); } catch (e1) { console.warn('reintento de guardado', e1); await sleep(1500); await Net.update(online.code, patch); }
