<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#110e0c"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{color-scheme:dark}body{margin:0;background:#110e0c}img{max-width:100%}</style></head><body><title>Inti Caído</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: mapa pixel a pantalla completa; HUD arriba, barra de mando abajo, cajas biseladas estilo cartucho de 8 bits. Un solo look oscuro, a propósito. */
:root {
  --ash: #110e0c;        /* fondo, ceniza */
  --panel: #241d18;      /* cajas */
  --panel-2: #33291f;
  --edge: #0d0b0a;       /* contorno negro de pixel */
  --hi: #4a3d31;         /* bisel claro */
  --lo: #15100d;         /* bisel oscuro */
  --bone: #efe6d8;
  --dust: #b3a490;
  --inti: #f2b84b;       /* acento: oro del sol caído */
  --inti-hi: #ffe08a;
  --inti-lo: #b8741f;
  --rust: #b0532c;
  --good: #7cc46a;
  --bad: #e5533d;
  --f-pixel: 'Press Start 2P', 'Courier New', monospace;
  --f-body: 'VT323', 'Courier New', monospace;
  --b: 3px;              /* tamaño de pixel de interfaz */
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ash); color: var(--bone); font-family: var(--f-body); font-size: 21px; line-height: 1.15; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: var(--b) solid var(--inti-hi); outline-offset: 2px; }
canvas.px-art, .px-art { image-rendering: pixelated; image-rendering: crisp-edges; }
input { font: inherit; font-size: 24px; color: var(--bone); background: var(--edge); border: var(--b) solid var(--hi); padding: 8px 12px; width: 100%; border-radius: 0; -webkit-user-select: text; user-select: text; }
#app { position: fixed; inset: 0; }
canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; image-rendering: pixelated; }

/* caja pixel biselada */
.box { background: var(--panel); border: var(--b) solid var(--edge); box-shadow: inset var(--b) var(--b) 0 var(--hi), inset calc(var(--b) * -1) calc(var(--b) * -1) 0 var(--lo); }
.btn-gold { background: var(--inti); color: #1d1408; border: var(--b) solid var(--edge); box-shadow: inset var(--b) var(--b) 0 var(--inti-hi), inset calc(var(--b) * -1) calc(var(--b) * -1) 0 var(--inti-lo); }
.btn-gold:active, .box.press:active { transform: translate(2px, 2px); box-shadow: inset calc(var(--b) * -1) calc(var(--b) * -1) 0 var(--inti-hi), inset var(--b) var(--b) 0 var(--inti-lo); }

/* ---------- pantallas de menú ---------- */
.screen { position: absolute; inset: 0; z-index: 30; background: var(--ash); }
#bg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.screen-scroll { position: absolute; inset: 0; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px); }
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.logo { font-family: var(--f-pixel); font-size: clamp(34px, 11vw, 54px); line-height: 1.1; color: var(--bone); margin-top: 9vh; text-shadow: 4px 4px 0 var(--edge); }
.logo span { color: var(--inti); display: block; text-shadow: 4px 4px 0 var(--inti-lo), 8px 8px 0 var(--edge); }
/* el título vive en el cielo, los botones sobre la ciudad */
.logo + .tag { margin-bottom: 22vh; }
.tag { font-family: var(--f-pixel); color: var(--dust); font-size: 9px; letter-spacing: .1em; line-height: 1.8; text-shadow: 2px 2px 0 var(--edge); }
.menu-btn { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; }
.menu-btn b { font-family: var(--f-pixel); font-weight: 400; font-size: 13px; line-height: 1.4; display: block; }
.menu-btn small { color: var(--dust); font-size: 20px; display: block; margin-top: 4px; }
.menu-btn .arrow { font-family: var(--f-pixel); color: var(--inti); font-size: 14px; }
.menu-btn.btn-gold small { color: #4a3612; }
.menu-btn.btn-gold .arrow { color: #1d1408; }
.menu-btn[disabled] { opacity: .45; pointer-events: none; }
.h2 { font-family: var(--f-pixel); font-size: 18px; line-height: 1.4; text-shadow: 3px 3px 0 var(--edge); }
.back { align-self: flex-start; color: var(--dust); padding: 4px 0; font-family: var(--f-pixel); font-size: 10px; }
.muted { color: var(--dust); font-size: 21px; line-height: 1.2; }
.label { font-family: var(--f-pixel); font-size: 9px; letter-spacing: .06em; color: var(--dust); line-height: 1.6; }

.fac[aria-pressed="true"] { background: color-mix(in srgb, var(--fc) 26%, var(--panel)); outline: var(--b) solid var(--fc); outline-offset: -1px; }
.fac .por { display: flex; gap: 8px; align-items: center; }
.fac b { font-family: var(--f-pixel); font-weight: 400; font-size: 10px; line-height: 1.4; }
.fac small { color: var(--dust); font-size: 18px; line-height: 1.1; }
.fac .suyo { font-family: var(--f-pixel); font-size: 7px; color: var(--fc); letter-spacing: .04em; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { flex: 1 1 0; min-width: 0; padding: 10px 2px; font-family: var(--f-pixel); font-size: 9px; overflow-wrap: anywhere; }
.seg button[aria-pressed="true"] { background: var(--inti); color: #1d1408; box-shadow: inset var(--b) var(--b) 0 var(--inti-hi), inset calc(var(--b) * -1) calc(var(--b) * -1) 0 var(--inti-lo); }

/* ---------- briefing / historia ---------- */
.brief { font-family: var(--f-pixel); font-size: 9px; color: var(--inti); letter-spacing: .06em; line-height: 1.6; }
.story { display: flex; flex-direction: column; gap: 12px; }
.say { display: flex; gap: 12px; align-items: flex-start; padding: 12px; }
.say .who { font-family: var(--f-pixel); font-size: 8px; color: var(--inti); display: block; margin-bottom: 6px; line-height: 1.5; }
.say p { margin: 0; font-size: 23px; line-height: 1.15; }
.say.narr { background: rgba(13,11,10,.78); border: var(--b) solid var(--hi); box-shadow: none; }
.say .por { flex: none; background: var(--edge); padding: 3px; }
.typing::after { content: '_'; color: var(--inti); animation: blink 0.8s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- HUD ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px 8px; display: flex; align-items: center; gap: 6px; z-index: 10; pointer-events: none; }
.hud > * { pointer-events: auto; }
.chip { display: flex; align-items: center; gap: 5px; padding: 6px 7px; font-family: var(--f-pixel); font-size: 9px; white-space: nowrap; }
.chip .dot { width: 12px; height: 12px; background: var(--fc, var(--inti)); border: var(--b) solid var(--edge); box-sizing: content-box; }
.chip .num { font-variant-numeric: tabular-nums; display: inline-block; }
.chip .num.up { animation: numup .45s steps(6); color: var(--good); }
.chip .num.down { animation: numdown .45s steps(6); color: #ff8a73; }
@keyframes numup { 0% { transform: translateY(6px) scale(1.25); } 100% { transform: none; } }
@keyframes numdown { 0% { transform: translateY(-6px) scale(1.25); } 100% { transform: none; } }
.sheet-head canvas, .sheet-head [data-por], .modal-head [data-spr] { animation: popnum .25s steps(4); }
.stats .stat b, .status-grid .stile b, .scorerow b { display: inline-block; animation: popnum .3s steps(4) both; }
.status-grid .stile { animation: up .25s steps(4) both; }
.status-grid .stile:nth-child(2) { animation-delay: .05s; } .status-grid .stile:nth-child(3) { animation-delay: .1s; } .status-grid .stile:nth-child(4) { animation-delay: .15s; } .status-grid .stile:nth-child(5) { animation-delay: .2s; } .status-grid .stile:nth-child(6) { animation-delay: .25s; }
.scorerow { animation: up .25s steps(4) both; } .scorerow:nth-child(2) { animation-delay: .08s; } .scorerow:nth-child(3) { animation-delay: .16s; } .scorerow:nth-child(4) { animation-delay: .24s; } .scorerow:nth-child(5) { animation-delay: .32s; }
.scorerow .bar i { animation: barfill .7s steps(10) both; transform-origin: left; }
@keyframes barfill { from { transform: scaleX(0); } }
.tcard, .card-opt, .menu-btn { transition: transform .08s; } .tcard:active, .card-opt:active, .menu-btn:active { transform: translateY(2px) scale(.98); }
.sheet .quick .act { animation: up .2s steps(4) both; }
.hpbar i { transition: width .35s steps(6); }
.chip .inc { color: var(--good); }
.hud .grow { flex: 1; }
.round { width: 40px; height: 40px; display: grid; place-items: center; }
.round i { display: block; width: 18px; height: 3px; background: var(--bone); box-shadow: 0 -6px 0 var(--bone), 0 6px 0 var(--bone); }
.banner { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 60px); transform: translateX(-50%); z-index: 11; padding: 6px 12px; font-size: 20px; color: var(--dust); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.banner b { color: var(--bone); font-weight: 400; }
.duel { position: absolute; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); z-index: 14; max-width: 520px; margin: 0 auto; padding: 8px 10px; border-color: var(--bad); background: linear-gradient(180deg, #3a1712, var(--panel) 70%); display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; animation: duelin .22s steps(5); }
@keyframes duelin { from { transform: translateY(16px) scale(.96); opacity: 0; } }
.duel .side { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; }
.duel .side small { font-size: 14px; color: var(--dust); max-width: 70px; text-align: center; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.duel .side .hp { font-size: 15px; color: var(--bone); }
.duel .mid { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.duel .dmg { font-family: var(--f-pixel); font-size: 20px; color: #ffd45a; line-height: 1; animation: popnum .35s steps(5); text-shadow: 3px 3px 0 #000; }
.duel .dmg.kill { color: #ff6a4d; }
.duel .ret { font-size: 16px; color: #8fd0ff; }
.duel .ret.none { color: var(--dust); }
.duel .arrow-d { font-family: var(--f-pixel); font-size: 10px; color: var(--bad); }
.duel .acts { grid-column: 1 / -1; display: flex; gap: 8px; }
.duel .acts .go { flex: 1; font-size: 11px; padding: 12px; background: var(--bad); color: #fff; border-color: #ff8a73; animation: pulse-atk 1s steps(4) infinite; }
@keyframes pulse-atk { 50% { background: #ff6a4d; } }
.duel .acts .no { flex: none; padding: 12px 14px; }
.mission { position: absolute; left: 8px; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 10; padding: 5px 9px; font-size: 17px; color: var(--bone); text-align: left; display: flex; align-items: center; gap: 7px; max-width: 62vw; border-color: var(--inti); animation: up .25s steps(4); }
.mission .mk { font-family: var(--f-pixel); font-size: 7px; color: var(--inti); letter-spacing: .05em; }
.mission .mp { font-family: var(--f-pixel); font-size: 8px; color: var(--good); margin-left: auto; flex: none; }
.mission.done { border-color: var(--good); animation: popnum .35s steps(5); }
@media (min-width: 760px) { .mission { left: 340px; } }
.banner { display: flex; align-items: center; gap: 6px; }
.banner .think canvas { display: block; }

/* barra de mando */
.cmd { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 8px calc(env(safe-area-inset-bottom, 0px) + 10px); display: flex; align-items: flex-end; gap: 8px; z-index: 12; pointer-events: none; }
.cmd > * { pointer-events: auto; }
.cmd .tool { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; padding: 8px 0 6px; font-family: var(--f-pixel); font-size: 7px; color: var(--dust); position: relative; }
.cmd .tool canvas { width: 30px; height: 30px; }
.cmd .tool .badge { position: absolute; top: -8px; right: -6px; background: var(--inti); color: #1d1408; font-size: 8px; padding: 3px 5px; border: var(--b) solid var(--edge); }
.end { margin-left: auto; padding: 16px 18px; font-family: var(--f-pixel); font-size: 12px; line-height: 1.3; }
.end[disabled] { background: var(--panel-2); color: var(--dust); box-shadow: inset var(--b) var(--b) 0 var(--hi), inset calc(var(--b) * -1) calc(var(--b) * -1) 0 var(--lo); }
.end.pulse { animation: pulse 1s steps(2) infinite; }
/* botón de turno: verde oscuro mientras quedan tropas, verde brillante con check cuando todo listo */
.end .cnt { display: inline-block; min-width: 18px; margin-left: 6px; padding: 2px 5px; background: #1d1408; color: var(--inti); font-size: 9px; vertical-align: middle; }
.end.ready { background: #35a04a; color: #0d1a0f; border-color: #7cf08a; animation: readyPulse 1.1s steps(3) infinite; }
.end.ready .chk { display: inline-block; animation: popnum .35s steps(4); }
.end.pending { background: #2a5a33; color: #cfeec9; border-color: #4f9a5c; }
@keyframes readyPulse { 50% { background: #5fd072; } }
/* la barra de botones se esconde cuando un panel grande está abierto y vuelve al cerrarlo */
.cmd { transition: transform .22s steps(5), opacity .2s; }
body.panel-open .cmd { transform: translateY(120%); opacity: 0; pointer-events: none; }
body.panel-open .cmd > * { pointer-events: none; }
body.panel-open .sheet { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); max-height: 70vh; }
/* estadísticas gráficas */
.gstats { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.gstat { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 5px; background: var(--edge); font-size: 19px; color: var(--bone); }
.gstat b { font-weight: 400; color: var(--bone); }
.gstat.good b { color: var(--good); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 10px; height: 10px; background: #2a2420; border: 2px solid #5a544d; display: inline-block; }
.pips i.on { background: var(--inti); border-color: var(--inti-hi); }
.pips.troops i.on { background: var(--bone); border-color: #fff; }
.pips.troops i { border-radius: 50%; width: 9px; height: 9px; }
.hint.short { font-size: 17px; padding: 4px 8px; }
@keyframes pulse { 50% { background: var(--inti-hi); } }

/* panel de selección */
.sheet { position: absolute; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); z-index: 13; padding: 12px; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; animation: up .12s steps(3); }
@keyframes up { from { transform: translateY(12px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head canvas { width: 48px; height: 48px; background: var(--edge); }
.sheet-head .title { font-family: var(--f-pixel); font-size: 12px; line-height: 1.4; }
.sheet-head .sub { color: var(--dust); font-size: 19px; }
.x { margin-left: auto; width: 36px; height: 36px; display: grid; place-items: center; color: var(--dust); font-family: var(--f-pixel); font-size: 12px; background: var(--edge); flex: none; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; }
.stat { font-size: 19px; padding: 1px 7px; background: var(--edge); color: var(--dust); }
.stat b { color: var(--bone); font-weight: 400; }
.hint { font-size: 20px; color: var(--dust); line-height: 1.15; }
.act { padding: 11px 12px; font-family: var(--f-pixel); font-size: 10px; line-height: 1.4; background: var(--inti); color: #1d1408; border: var(--b) solid var(--edge); box-shadow: inset var(--b) var(--b) 0 var(--inti-hi), inset calc(var(--b) * -1) calc(var(--b) * -1) 0 var(--inti-lo); }
.act:active { transform: translate(2px, 2px); }
.act.ghost { background: var(--panel-2); color: var(--bone); border: var(--b) solid var(--edge); box-shadow: inset var(--b) var(--b) 0 var(--hi), inset calc(var(--b) * -1) calc(var(--b) * -1) 0 var(--lo); }
.act.danger { background: var(--bad); color: #fff; box-shadow: inset var(--b) var(--b) 0 #ff8a73, inset calc(var(--b) * -1) calc(var(--b) * -1) 0 #8e2a1c; }
.act[disabled] { opacity: .4; pointer-events: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .act { flex: 1; }
.trainer { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.tcard { flex: 0 0 88px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 6px; background: var(--edge); border: var(--b) solid var(--hi); }
.tcard canvas { width: 48px; height: 48px; }
.tcard b { font-size: 17px; font-weight: 400; text-align: center; line-height: 1; }
.tcard .cost { font-family: var(--f-pixel); font-size: 8px; color: var(--inti); }
.tcard[disabled] { opacity: .38; }
.tcard.lock .cost { color: var(--dust); font-size: 7px; }
.pips { display: flex; gap: 3px; align-items: center; }
.pips i { width: 12px; height: 9px; background: var(--edge); border: 2px solid var(--hi); }
.pips i.on { background: var(--inti); }
.fore { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; padding: 8px 10px; background: #3a1712; border: var(--b) solid var(--bad); font-size: 18px; animation: up .18s steps(4); }
.fore .ftgt { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 18px; color: var(--bone); }
.fore .ftgt b { font-family: var(--f-pixel); font-size: 9px; }
.fore .fbox { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border: 2px solid rgba(255,255,255,.15); background: rgba(0,0,0,.25); text-align: center; }
.fore .fbox small { font-size: 15px; color: var(--dust); text-transform: uppercase; letter-spacing: .04em; margin: 0; }
.fore .fbox b { font-family: var(--f-pixel); font-size: 18px; line-height: 1.2; animation: popnum .35s steps(5); }
.fore .fbox.hit b { color: #ffd45a; }
.fore .fbox.kill b { color: #ff6a4d; }
.fore .fbox.ret b { color: #8fd0ff; }
.fore .fbox.ret.none b { color: var(--dust); }
.fore .fhint { grid-column: 1 / -1; font-size: 15px; color: var(--dust); text-align: center; }
@keyframes popnum { 0% { transform: scale(1.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* modales */
.modal-bg { position: absolute; inset: 0; background: rgba(8,7,6,.7); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.modal { width: 100%; max-width: 560px; max-height: 86%; overflow-y: auto; padding: 16px 14px calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; gap: 10px; animation: up .12s steps(3); }
@media (min-width: 700px) { .modal-bg { align-items: center; } }
.modal-head { display: flex; align-items: center; gap: 10px; }
.tech { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 10px; background: var(--edge); border: var(--b) solid var(--hi); }
.tech b { font-family: var(--f-pixel); font-weight: 400; font-size: 10px; line-height: 1.5; }
.tech small { grid-column: 1; color: var(--dust); font-size: 19px; }
.tech .act { grid-row: 1 / span 2; grid-column: 2; padding: 10px 12px; }
.tech.done { border-color: #3d5a2f; }
.tech .ok { grid-row: 1 / span 2; grid-column: 2; color: var(--good); font-family: var(--f-pixel); font-size: 9px; }
.rival { padding: 10px; background: var(--edge); border: var(--b) solid var(--hi); display: flex; flex-direction: column; gap: 10px; }
.rival-top { display: flex; align-items: center; gap: 10px; }
.rival-top canvas { width: 48px; height: 48px; border: var(--b) solid var(--fc); }
.rival-top b { font-family: var(--f-pixel); font-weight: 400; font-size: 10px; line-height: 1.5; }
.rival-top small { color: var(--dust); display: block; font-size: 18px; }
.pill { margin-left: auto; font-family: var(--f-pixel); font-size: 7px; padding: 5px 6px; border: 2px solid currentColor; }
.pill.guerra { color: #ff8a73; }
.pill.alianza { color: #a6e08f; }
.bar { height: 9px; background: var(--panel-2); border: 2px solid var(--lo); }
.bar i { display: block; height: 100%; background: var(--fc); }
.offer { padding: 10px; border: var(--b) solid var(--inti); background: #3a2a12; display: flex; flex-direction: column; gap: 10px; }
.log { font-size: 19px; line-height: 1.15; color: var(--dust); display: flex; flex-direction: column; gap: 4px; }
.log span { color: var(--inti); font-family: var(--f-pixel); font-size: 8px; }

/* toasts */
.toasts { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 25; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { padding: 8px 12px; font-size: 20px; max-width: 440px; animation: up .18s steps(4); transition: opacity .45s, transform .45s; }
.toast.out { opacity: 0; transform: translateY(-8px); }
.stat.gear { border-color: var(--inti); color: var(--inti-hi); }
.stat.harvest { border-color: var(--good); color: var(--good); }
.scale-hint { border-left: 4px solid var(--inti); padding-left: 8px; }
.avatars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.avatar { padding: 6px 2px; display: grid; place-items: center; border-color: var(--hi); }
.avatar canvas { width: 40px; height: 40px; }
.avatar[aria-pressed="true"] { border-color: var(--fc); background: color-mix(in srgb, var(--fc) 22%, var(--panel)); box-shadow: 0 0 0 2px var(--fc); animation: popnum .25s steps(4); }
.seat .seat-av { margin-left: 4px; flex: none; }
.profile.press { cursor: pointer; }
.profile .arrow { margin-left: auto; color: var(--inti); font-size: 24px; }
.upg { display: grid; grid-template-columns: auto auto auto 1fr; align-items: center; gap: 6px 8px; padding: 8px 10px; text-align: left; border-color: var(--hi); }
.upg.can { border-color: var(--inti); background: linear-gradient(180deg, #2a2014, var(--panel) 70%); animation: pulse2 1.6s steps(3) infinite; }
.upg[disabled] { opacity: .7; }
.upg .upg-city canvas { width: 40px; height: 38px; display: block; }
.upg .upg-arrow { font-family: var(--f-pixel); font-size: 10px; color: var(--inti); }
.upg .upg-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.upg .upg-cost { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-pixel); font-size: 10px; color: #ff8a73; }
.upg .upg-cost.ok { color: var(--good); }
.upg .upg-bar { display: block; height: 6px; background: #1a1512; border: 2px solid var(--edge); }
.upg .upg-bar i { display: block; height: 100%; background: var(--inti); transition: width .4s steps(8); }
.upg .upg-gain { font-size: 16px; color: var(--dust); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.rw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rw { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; text-align: center; border-color: var(--inti); animation: up .3s steps(5) both; }
.rw b { font-family: var(--f-pixel); font-size: 10px; font-weight: 400; color: var(--inti-hi); }
.rw small { font-size: 17px; color: var(--bone); line-height: 1.1; }
.lands { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 2px; }
.lands .land { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 4px; border: 2px solid var(--cc, var(--fc)); background: #1a1512; font-size: 17px; cursor: pointer; }
.lands small { width: 100%; font-size: 15px; }
.toast.gold { border-color: var(--inti); }
.toast.red { border-color: var(--bad); }

.flash { position: absolute; inset: 0; z-index: 24; display: grid; place-items: center; pointer-events: none; }
.flash div { font-family: var(--f-pixel); font-size: clamp(26px, 8vw, 52px); line-height: 1.2; text-align: center; padding: 0 16px; text-shadow: 4px 4px 0 var(--edge); animation: flash 2.6s steps(16) forwards; }
.flash small { display: block; font-family: var(--f-body); font-size: 24px; color: var(--bone); margin-top: 10px; text-shadow: 2px 2px 0 var(--edge); }
@keyframes flash { 0% { transform: scale(1.4); opacity: 0; } 12% { transform: scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

/* tutorial: diálogo con retrato */
.coach { position: absolute; left: 8px; right: 8px; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 14; max-width: 520px; margin: 0 auto; padding: 10px; display: flex; gap: 10px; align-items: flex-start; }
.coach canvas { width: 48px; height: 48px; flex: none; background: var(--edge); }
.coach .who { font-family: var(--f-pixel); font-size: 7px; color: var(--inti); display: block; margin-bottom: 4px; line-height: 1.5; }
.coach p { margin: 0; font-size: 21px; line-height: 1.1; }
.coach .skip { margin-left: auto; font-family: var(--f-pixel); font-size: 7px; color: var(--dust); flex: none; padding: 4px; }

.code { font-family: var(--f-pixel); font-size: 40px; letter-spacing: .14em; color: var(--inti); text-align: center; padding: 10px 0; text-shadow: 4px 4px 0 var(--inti-lo); -webkit-user-select: text; user-select: text; }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
.seat canvas { width: 40px; height: 40px; }
.seat b { font-weight: 400; font-size: 22px; }
.seat small { color: var(--dust); font-size: 18px; }
.seat .seat-t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.seat .seat-t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .seat-t small { display: block; line-height: 1.1; }
.seat .seat-r { margin-left: auto; text-align: right; flex: none; color: var(--inti); }
.seat.editable { cursor: pointer; border-color: var(--fc); }
.seat.picking { background: color-mix(in srgb, var(--fc) 18%, var(--panel)); }
.seats { display: flex; flex-direction: column; gap: 8px; }
.lobby-grid { animation: up .18s steps(4); }
.lobby-grid .fac[disabled] { opacity: .4; }
.game-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; text-align: left; width: 100%; }
.game-item b { font-family: var(--f-pixel); font-weight: 400; font-size: 11px; color: var(--inti); }
.game-item small { color: var(--dust); margin-left: auto; text-align: right; font-size: 18px; }
.howto h3 { font-family: var(--f-pixel); font-weight: 400; font-size: 11px; margin: 14px 0 6px; color: var(--inti); line-height: 1.5; }
.howto p { margin: 0 0 6px; line-height: 1.15; font-size: 21px; }

/* ---------- tarjetas con personalidad ---------- */
.card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px 10px 10px; position: relative; overflow: hidden; background: linear-gradient(90deg, color-mix(in srgb, var(--cc) 22%, var(--panel)), var(--panel) 55%); }
.card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--cc); box-shadow: inset -2px 0 0 rgba(0,0,0,.4); }
.card[data-gold] { background: linear-gradient(90deg, color-mix(in srgb, var(--inti) 30%, var(--panel)), var(--panel) 60%); }
.card-art { display: block; width: 66px; height: 66px; flex: none; background: var(--edge); border: var(--b) solid var(--edge); image-rendering: pixelated; margin-left: 4px; }
.card-art canvas { display: block; }
.card-body { min-width: 0; flex: 1; }
.card-body b { font-family: var(--f-pixel); font-weight: 400; font-size: 12px; line-height: 1.4; display: block; color: var(--bone); }
.card-body small { display: block; color: var(--dust); font-size: 19px; line-height: 1.1; margin-top: 3px; }
.card .arrow { font-family: var(--f-pixel); color: var(--cc); font-size: 14px; }
.chap { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; position: relative; background: linear-gradient(90deg, color-mix(in srgb, var(--cc) 18%, var(--panel)), var(--panel) 60%); }
.chap-n { font-family: var(--f-pixel); font-size: 26px; color: var(--cc); width: 44px; height: 44px; display: grid; place-items: center; background: var(--edge); border: var(--b) solid var(--cc); flex: none; text-shadow: 3px 3px 0 #000; }
.chap.locked .chap-n { color: var(--dust); border-color: var(--hi); font-size: 18px; }
.chap.locked { opacity: .55; }
.chap-state { font-family: var(--f-pixel); font-size: 9px; color: var(--good); flex: none; }
.chap.done .chap-n { background: var(--cc); color: #1d1408; }
.objective { padding: 10px 12px; border-color: var(--inti); }
.objective .who { font-family: var(--f-pixel); font-size: 8px; color: var(--inti); display: block; margin-bottom: 4px; }
.objective p { margin: 0; font-size: 21px; }
.say { border-left: 6px solid var(--cc, var(--hi)); }

/* ---------- facciones ---------- */
.fac-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fac { text-align: center; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.fac canvas { width: 44px; height: 44px; }
.fac-t b { display: block; font-family: var(--f-pixel); font-weight: 400; font-size: 9px; line-height: 1.4; }
.fac-t small { display: block; color: var(--dust); font-size: 15px; line-height: 1; }
.facinfo { padding: 12px; border-color: var(--fc); display: flex; flex-direction: column; gap: 10px; background: linear-gradient(180deg, color-mix(in srgb, var(--fc) 16%, var(--panel)), var(--panel)); }
.facinfo p, .codex-fac p { margin: 0; font-size: 20px; line-height: 1.15; color: var(--bone); }
.facinfo-top { display: flex; align-items: center; gap: 10px; }
.facinfo-top b { font-family: var(--f-pixel); font-weight: 400; font-size: 11px; line-height: 1.4; color: var(--fc); display: block; }
.facinfo-top small { display: block; color: var(--dust); font-size: 17px; line-height: 1.1; }
.facinfo-top > span:last-child:not(:nth-child(1)) { margin-left: auto; }
.facinfo-row { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
.facinfo-row.box { padding: 10px; }
.facinfo-row > span { flex: none; }
.facinfo-row > div { min-width: 0; }
.facinfo-row b { font-size: 21px; display: block; line-height: 1.1; }
.facinfo-row b.guerra { color: #ff8a73; } .facinfo-row b.industria { color: var(--inti); } .facinfo-row b.supervivencia { color: #a6e08f; }
.facinfo-row small { display: block; color: var(--dust); font-size: 18px; line-height: 1.1; margin-top: 2px; }
.facinfo-row small b { display: inline; font-size: 18px; color: var(--bone); }
.codex-fac { padding: 12px; border-color: var(--fc); display: flex; flex-direction: column; gap: 10px; background: linear-gradient(180deg, color-mix(in srgb, var(--fc) 16%, var(--panel)), var(--panel)); }
.troop { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 70px; }
.troop small { font-size: 15px; color: var(--dust); text-align: center; line-height: 1; }
.seg button small { display: block; font-family: var(--f-body); font-size: 15px; color: var(--dust); margin-top: 2px; }
.seg button[aria-pressed="true"] small { color: #4a3612; }
.uniq { font-family: var(--f-pixel); font-size: 6px; color: var(--inti-hi); background: var(--edge); padding: 2px 4px; }

/* ---------- árbol de tecnología ---------- */
.advice { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-color: var(--inti); }
.advice .who { font-family: var(--f-pixel); font-size: 7px; color: var(--inti); display: block; margin-bottom: 2px; }
.advice p { margin: 0; font-size: 19px; line-height: 1.1; }
.advice .arrow { margin-left: auto; color: var(--inti); font-family: var(--f-pixel); }
.legend { display: flex; gap: 14px; font-size: 16px; color: var(--dust); }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -1px; border: 2px solid var(--hi); }
.legend i.done { background: var(--inti); border-color: var(--inti); } .legend i.can { background: var(--panel-2); border-color: var(--bone); } .legend i.lock { background: var(--edge); }
.branch { display: flex; flex-direction: column; gap: 6px; }
.branch-name { font-family: var(--f-pixel); font-size: 9px; letter-spacing: .06em; padding: 4px 0 2px; border-bottom: 2px solid var(--hi); }
.branch-name.guerra { color: #ff8a73; } .branch-name.industria { color: var(--inti); } .branch-name.supervivencia { color: #a6e08f; }
.tiers { display: flex; flex-direction: column; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.tline { display: flex; align-items: center; gap: 0; }
.tnode { flex: 0 0 96px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; background: var(--edge); border: var(--b) solid var(--hi); min-height: 78px; }
.tnode b { font-family: var(--f-pixel); font-weight: 400; font-size: 7px; line-height: 1.4; text-align: center; }
.tnode small { font-size: 15px; color: var(--dust); line-height: 1; }
.tnode.done { background: color-mix(in srgb, var(--inti) 28%, var(--edge)); border-color: var(--inti); }
.tnode.done small { color: var(--inti-hi); }
.tnode.can { border-color: var(--bone); background: var(--panel-2); }
.tnode.poor { border-color: var(--hi); }
.tnode.lock { opacity: .4; }
.tnode.focus { outline: var(--b) solid var(--inti-hi); outline-offset: 2px; }
.tnode.empty { flex: 0 0 96px; min-height: 0; border: 0; background: none; }
.arrow-t { flex: 0 0 18px; height: 4px; background: var(--hi); position: relative; }
.arrow-t::after { content: ''; position: absolute; right: -2px; top: -4px; border: 6px solid transparent; border-left: 8px solid var(--hi); }
.arrow-t.none { visibility: hidden; }
.tdetail { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; position: sticky; bottom: 0; }
.tdetail p { margin: 0; font-size: 20px; line-height: 1.15; }
.td-head { display: flex; align-items: center; gap: 8px; }
.td-head b { font-family: var(--f-pixel); font-weight: 400; font-size: 11px; line-height: 1.4; }
.td-unit { display: flex; gap: 10px; align-items: center; background: var(--edge); padding: 6px; }
.td-unit b { font-size: 20px; display: block; }
.td-unit small { display: block; font-size: 16px; color: var(--dust); line-height: 1.1; }

/* ---------- logros ---------- */
.ach { display: flex; align-items: center; gap: 10px; padding: 8px 10px; opacity: .55; }
.ach.on { opacity: 1; border-color: var(--inti); background: linear-gradient(90deg, color-mix(in srgb, var(--inti) 18%, var(--panel)), var(--panel)); }
.ach b { display: block; font-size: 21px; line-height: 1.1; }
.ach small { display: block; color: var(--dust); font-size: 17px; line-height: 1.1; }
.ach-st { margin-left: auto; font-family: var(--f-pixel); color: var(--inti); }
.ach-ic { flex: none; background: var(--edge); }
.chip .dot { width: 18px; height: 18px; background: none; border: 0; display: grid; place-items: center; }


/* ---------- energía / protocolos ---------- */
#energyChip.ready { border-color: var(--inti); box-shadow: inset var(--b) var(--b) 0 var(--inti-lo), inset calc(var(--b) * -1) calc(var(--b) * -1) 0 var(--lo), 0 0 0 2px rgba(242,184,75,.25); animation: pulse2 1.2s steps(2) infinite; }
@keyframes pulse2 { 50% { background: #3a2a12; } }
.hud { flex-wrap: nowrap; }
@media (max-width: 380px) { .chip { font-size: 8px; padding: 6px 5px; } }
.tabs { display: flex; gap: 6px; margin-top: 6px; }
.tab { font-family: var(--f-pixel); font-size: 8px; padding: 7px 9px; background: var(--edge); border: var(--b) solid var(--hi); color: var(--dust); }
.tab.on { background: var(--inti); color: #1d1408; border-color: var(--inti); }
.tabn { background: var(--edge); color: var(--inti); padding: 1px 4px; margin-left: 4px; }
.res-row { display: flex; gap: 8px; flex-wrap: wrap; font-size: 18px; color: var(--dust); }
.res { display: inline-flex; align-items: center; gap: 5px; background: var(--edge); padding: 3px 8px; }
.res b { color: var(--bone); font-weight: 400; }
.branch-name { display: flex; align-items: center; gap: 8px; }
.bprog { flex: 1; height: 6px; background: var(--edge); border: 2px solid var(--lo); }
.bprog i { display: block; height: 100%; background: currentColor; }
.branch-name small { font-family: var(--f-body); font-size: 16px; color: var(--dust); }
.energy-box { display: flex; gap: 10px; align-items: center; padding: 10px; border-color: var(--inti); background: linear-gradient(90deg, #3a2a12, var(--panel)); }
.energy-box b { display: block; font-size: 22px; color: var(--inti); }
.energy-box small { display: block; color: var(--dust); font-size: 17px; line-height: 1.1; }
.power { display: flex; gap: 10px; align-items: center; padding: 8px 10px; }
.power.can { border-color: var(--inti); }
.power > div { flex: 1; min-width: 0; }
.power b { display: block; font-size: 21px; line-height: 1.1; }
.power small { display: block; color: var(--dust); font-size: 17px; line-height: 1.1; }
.power .act { flex: none; padding: 9px 10px; font-size: 9px; }
.power .e { color: #1d1408; }

/* ---------- panel de ciudad ---------- */
.sheet.capital { border-color: var(--inti); box-shadow: inset var(--b) var(--b) 0 var(--inti-lo), inset calc(var(--b) * -1) calc(var(--b) * -1) 0 var(--lo), 0 0 0 3px #000, 0 0 0 5px var(--cc); background: linear-gradient(180deg, color-mix(in srgb, var(--cc) 22%, var(--panel)), var(--panel) 40%); }
.sheet.capital .title { color: var(--inti); text-shadow: 2px 2px 0 #000; }
.sheet.capital .sheet-head .sub:first-of-type { color: var(--cc); font-family: var(--f-pixel); font-size: 7px; letter-spacing: .06em; }
.sheet.throne { border-color: #ffe08a; background: linear-gradient(180deg, #3a2a12, var(--panel) 50%); }
.sheet .cem { margin-left: auto; }
.sheet-head #cicon canvas { width: 60px; height: 57px; background: var(--edge); border: var(--b) solid var(--edge); }
.cap-hint { color: var(--inti-hi); border-left: 3px solid var(--inti); padding-left: 8px; }
.act small { display: block; font-family: var(--f-body); font-size: 15px; font-weight: 400; margin-top: 2px; opacity: .8; }

/* ---------- modos y modificadores ---------- */
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mode { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; text-align: center; }
.mode b { font-family: var(--f-pixel); font-weight: 400; font-size: 7px; line-height: 1.4; }
.mode small { font-size: 14px; line-height: 1; color: var(--dust); }
.mode.on small { color: #3a2a12; }
.seg .locura { border-color: var(--bad); color: #ff8a73; } .seg .locura[aria-pressed="true"] { background: #4a1510; color: #ffb3a3; border-color: var(--bad); }
.diffdesc { border-left: 4px solid var(--inti); padding-left: 8px; }
.modeinfo { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; border-color: var(--inti); background: linear-gradient(180deg, #2a2014, var(--panel) 60%); animation: up .18s steps(4); }
.modeinfo-top { display: flex; align-items: center; gap: 10px; }
.modeinfo-top b { font-family: var(--f-pixel); font-weight: 400; font-size: 10px; display: block; color: var(--inti); margin-bottom: 3px; }
.modeinfo-top small { font-size: 18px; color: var(--bone); line-height: 1.1; display: block; }
.modewin { display: flex; flex-direction: column; gap: 2px; }
.modewin .who { font-family: var(--f-pixel); font-size: 7px; color: var(--dust); letter-spacing: .06em; }
.modewin p { margin: 0; font-size: 20px; line-height: 1.15; }
.modehow { margin: 0; padding-left: 18px; font-size: 18px; color: var(--dust); line-height: 1.2; }
.mode.on { background: var(--inti); color: #1d1408; border-color: var(--inti); box-shadow: inset var(--b) var(--b) 0 var(--inti-hi), inset calc(var(--b) * -1) calc(var(--b) * -1) 0 var(--inti-lo); }
.modedesc { font-size: 18px; margin: 0; }
.label small { font-family: var(--f-body); font-size: 15px; text-transform: none; letter-spacing: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-m { font-family: var(--f-pixel); font-size: 7px; padding: 8px 9px; background: var(--edge); border: var(--b) solid var(--hi); color: var(--dust); }
.chip-m.on { background: #3a2a12; border-color: var(--inti); color: var(--inti-hi); }
.chip-m.forced { opacity: .7; pointer-events: none; }
.reto { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; position: relative; background: linear-gradient(90deg, color-mix(in srgb, var(--cc) 20%, var(--panel)), var(--panel) 60%); border-left: 6px solid var(--cc); }
.reto.done { border-color: var(--good); }
.reto .rules { color: var(--cc); font-size: 16px; margin-top: 4px; }


/* ---------- tema por facción ---------- */
:root { --fc: #f2b84b; --fc-dim: #4a3612; --fc-hi: #ffe08a; }
.hud .chip { border-left: var(--b) solid var(--fc); }
.cmd .tool { border-top: var(--b) solid var(--fc); }
.sheet { border-top: 6px solid var(--cc, var(--fc)); }
.sheet.unit .title { color: var(--cc); text-shadow: 2px 2px 0 #000; }
.sheet.vet { box-shadow: inset var(--b) var(--b) 0 var(--hi), inset calc(var(--b) * -1) calc(var(--b) * -1) 0 var(--lo), 0 0 0 2px var(--inti-lo); }
.vetline { color: var(--inti) !important; font-family: var(--f-pixel); font-size: 7px !important; }
.modal { border-top: 6px solid var(--fc); }
.modal-head > span[data-spr] { margin-left: auto; margin-right: 6px; }
.hpbar { display: flex; align-items: center; gap: 8px; }
.hp-l { font-family: var(--f-pixel); font-size: 7px; color: var(--dust); }
.hp-t { flex: 1; height: 10px; background: var(--edge); border: 2px solid var(--hi); }
.hp-t i { display: block; height: 100%; }
.hp-n { font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span[data-spr] { display: inline-block; vertical-align: -1px; margin-right: 2px; }
.terrain-line { display: flex; align-items: center; gap: 8px; font-size: 18px; color: var(--dust); line-height: 1.1; }
.t-sw { width: 14px; height: 14px; flex: none; border: 2px solid var(--edge); }

  // ---------- azar con semilla ----------
  function rng(st) {
    let t = (st.seed = (st.seed + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const pick = (st, arr) => arr[Math.floor(rng(st) * arr.length)];

  // ---------- datos ----------
  const MAPS = {
    peru:       { name: 'Perú', desc: 'Costa, sierra y selva como en el mapa real.' },

    pampa:      { name: 'Pampa', desc: 'Llanura abierta con pocas montañas. Rápido y agresivo.' },
    cordillera: { name: 'Cordillera', desc: 'Una muralla de montañas parte el mapa en dos.' },

  const SIZES = {

    if (UNITS[u.type].noMoveAttack) u.acted = true;
    const ri = st.ruins.indexOf(idx(x, y));
    if (ri >= 0) { st.ruins.splice(ri, 1); exploreRuin(st, u); }
    pillage(st, u);
    reveal(st, u.owner);
    event(st, { k: 'move', p: u.owner, id: u.id });
    return true;
  }

  function exploreRuin(st, u) {
    const p = st.players[u.owner];
    p.stats.ruins++;
    const mult = (hasTech(st, u.owner, 'chatarreria') ? 2 : 1) * (st.mods && st.mods.escasez ? 2 : 1);
    p.energy = (p.energy || 0) + 1;
    const bonus = (p.faction === 'culto' ? 3 : 0) + (p.relic3 ? 1 : 0);
    const roll = rng(st);
    let msg;
    if (roll < 0.4) { const n = (4 + Math.floor(rng(st) * 5)) * mult + bonus; p.scrap += n; msg = `Ruinas: encontraste ${n} de chatarra.`; }
    else if (roll < 0.6) {
      const opts = Object.keys(TECHS).filter((t) => !p.techs.includes(t) && techReqsMet(st, u.owner, t));
      if (opts.length) { const t = pick(st, opts); p.techs.push(t); msg = `Ruinas: planos antiguos. Aprendiste ${TECHS[t].name}.`; if (bonus) p.scrap += bonus; }
      else { p.scrap += 6 * mult + bonus; msg = `Ruinas: ${6 * mult + bonus} de chatarra.`; }
    } else if (roll < 0.8) {
      const n = neighbors(u.x, u.y).find(([nx, ny]) => passable(st, 'rondero', u.owner, nx, ny) && !unitAt(st, nx, ny) && !cityAt(st, nx, ny));
      if (n) { spawn(st, u.owner, 'rondero', n[0], n[1]); msg = 'Ruinas: sobrevivientes se unen a tu causa.'; if (bonus) p.scrap += bonus; }
      else { p.scrap += 5 * mult + bonus; msg = `Ruinas: ${5 * mult + bonus} de chatarra.`; }
    } else { if (rankOf(u) < 2) promote(st, u); u.hp = maxHp(u); msg = `Ruinas: armadura pre-caída. Tu ${UNITS[u.type].name} asciende a ${RANKS[rankOf(u)].name}.`; if (bonus) p.scrap += bonus; }
    event(st, { k: 'ruin', p: u.owner, msg, x: u.x, y: u.y });
    if (u.owner === st.cur) log(st, msg);
  }

  function defBonus(st, d) {
    const t = st.tiles[idx(d.x, d.y)];
    let b = TERRAIN[t].def;
    if (riverAt(st, d.x, d.y) && !bridgeAt(st, d.x, d.y) && !UNITS[d.type].naval && !UNITS[d.type].amphib && !UNITS[d.type].fly) b *= 0.8; // con el agua a la cintura
    const f = fac(st, d.owner);
    if (f === 'sierra' && t === 'montana') b += 0.35;
    if (f === 'selva' && t === 'selva') b += 0.6;
    const c = cityAt(st, d.x, d.y);
    if (c && c.owner === d.owner) {
      b = Math.max(b, hasTech(st, d.owner, 'murallas') ? 2.2 : 1.5);
      if (c.wall) b += 0.4;
      if ((st.builds || []).some((bb) => bb.owner === d.owner && bb.type === 'aserradero' && bb.city === c.id)) b += 0.3;
      if (hasTech(st, d.owner, 'bunker')) b += 0.5;
    }
    return b * (1 + harvest(st, d.owner));
  }
  function atkBonus(st, a) {
    let atk = UNITS[a.type].atk;
    const f = fac(st, a.owner);
    if (f === 'desierto' && a.type === 'explorador') atk += 1;
    if (f === 'culto' && neighbors(a.x, a.y).some(([nx, ny]) => { const o = unitAt(st, nx, ny); return o && o.owner === a.owner; })) atk += 0.5;
    if (f === 'selva' && st.tiles[idx(a.x, a.y)] === 'selva') atk += 0.5;
    if (a.type === 'triton' && st.tiles[idx(a.x, a.y)] === 'mar') atk += 1;
    if (a.type === 'barrenero' && a._vsCity) atk *= 1.5;
    atk += RANKS[rankOf(a)].atk + (a.gear && GEAR[a.gear].atk || 0);
    if (st.players[a.owner].moral > 0) atk -= 1;
    atk *= 1 + harvest(st, a.owner);
    if (st.players[a.owner].kind === 'ai' && diffOf(st.players[a.owner]).atkBoost) atk *= 1 + diffOf(st.players[a.owner]).atkBoost;
    return atk;
  }

  function forecast(st, a, d) {
    bind(st);
    const D = UNITS[d.type];
    if (a.type === 'barrenero') a._vsCity = !!cityAt(st, d.x, d.y);
    let atk = atkBonus(st, a);
    delete a._vsCity;
    if (st.players[a.owner].betrayed === d.owner) atk *= 1.5;
    const aF = atk * (a.hp / maxHp(a));
    const dF = (D.def + RANKS[rankOf(d)].def + (d.gear && GEAR[d.gear].def || 0)) * (d.hp / maxHp(d)) * defBonus(st, d);
    const tot = aF + dF;
    const dmg = Math.round((aF / tot) * atk * 4.5);
    const left = d.hp - dmg;
    const canRet = left > 0 && dist(a.x, a.y, d.x, d.y) <= unitRng(d);
    // contraataque: depende de lo fuerte que pega el defensor y de cuánta vida le queda; nunca pasa del 60% de la vida del atacante
    let ret = canRet ? Math.round(Math.min(dF / tot, 0.75) * Math.max(D.atk, D.def) * 4.5 * 0.75 * (0.6 + 0.4 * left / maxHp(d))) : 0;
    ret = Math.min(ret, Math.floor(maxHp(a) * 0.6));
    return { dmg, ret, kills: left <= 0 };
  }

  function killUnit(st, d, by) {
    st.units = st.units.filter((v) => v !== d);
    if (d.hero) { st.players[d.owner].moral = 3; log(st, `¡${d.name || 'El líder'} de ${st.players[d.owner].name} ha caído! Su facción pierde moral.`); event(st, { k: 'herodown', p: d.owner, x: d.x, y: d.y }); }
    st.players[d.owner].stats.lost++;
    if (by >= 0 && st.players[d.owner].horde && st.players[by].stats) st.players[by].stats.hordeKills++;
    event(st, { k: 'kill', x: d.x, y: d.y, type: d.type, owner: d.owner, by, id: d.id });
  }

  function attack(st, aid, did) {
    bind(st);
    const a = st.units.find((v) => v.id === aid), d = st.units.find((v) => v.id === did);
    if (!a || !d || a.owner !== st.cur) return false;
    if (!targets(st, a).includes(d)) return false;
    if (relation(st, a.owner, d.owner) !== 'guerra') return false;
    const f = forecast(st, a, d);
    d.hp -= f.dmg;
    a.acted = true; a.moved = true;
    event(st, { k: 'hit', x: d.x, y: d.y, v: f.dmg, ax: a.x, ay: a.y, rng: dist(a.x, a.y, d.x, d.y) > 1, atype: a.type, aid: a.id, did: d.id });
    if (d.hp <= 0) {
      const dx = d.x, dy = d.y, dtype = d.type;
      killUnit(st, d, a.owner);
      a.kills++; st.players[a.owner].kills++;
      if (a.type === 'buggy') st.players[a.owner].scrap += 2;
      const need = hasTech(st, a.owner, 'veterania') ? 2 : 3;
      if (a.kills >= need * (rankOf(a) + 1) && rankOf(a) < 2) { promote(st, a); if (a.owner === st.cur) log(st, `Tu ${UNITS[a.type].name} ascendió a ${RANKS[rankOf(a)].name}.`); }
      if (dist(a.x, a.y, dx, dy) === 1 && UNITS[a.type].rng === 1 && passable(st, a.type, a.owner, dx, dy)) {
        a.x = dx; a.y = dy;
        const ri = st.ruins.indexOf(idx(a.x, a.y));
        if (ri >= 0) { st.ruins.splice(ri, 1); exploreRuin(st, a); }
      }
      if (dtype === 'apu') log(st, `¡${st.players[a.owner].name} derribó un Mecha Apu!`);
    } else if (f.ret > 0) {
      a.hp -= f.ret;
      event(st, { k: 'hit', x: a.x, y: a.y, v: f.ret, ax: d.x, ay: d.y, rng: dist(a.x, a.y, d.x, d.y) > 1, atype: d.type, aid: d.id, did: a.id, ret: true });
      if (a.hp <= 0) killUnit(st, a, d.owner);
    }
    reveal(st, st.cur);
    checkWin(st);
    return true;
  }

  function capture(st, uid) {
    bind(st);
    const u = st.units.find((v) => v.id === uid);
    if (!u || u.owner !== st.cur || !canCapture(st, u)) return false;
    const c = cityAt(st, u.x, u.y);
    const prev = c.owner;
    c.owner = u.owner;
    u.acted = true; u.moved = true;
    st.players[u.owner].stats.captures++;
    if (fac(st, u.owner) === 'desierto') st.players[u.owner].scrap += 3;
    st.units.forEach((v) => { if (v.home === c.id && v.owner !== u.owner) v.home = -1; });
    for (const b of st.builds || []) if (b.city === c.id) b.owner = u.owner;
    log(st, `${st.players[u.owner].name} tomó ${c.name}${prev >= 0 ? ' a ' + st.players[prev].name : ''}.`);
    if (c.throne && st.throne) { st.throne = { owner: u.owner, turns: 0 }; event(st, { k: 'throne', p: u.owner }); }
    if (st.mods.subita && c.capital && prev >= 0 && st.players[prev].alive) {
      for (const cc of st.cities) if (cc.owner === prev) cc.owner = -1;
      log(st, `¡Muerte súbita! ${st.players[prev].name} cae con su capital.`);
    }
    event(st, { k: 'capture', p: u.owner, prev, x: c.x, y: c.y, name: c.name, capital: !!c.capital });
    reveal(st, u.owner);
    if (prev >= 0) checkElim(st, prev);
    checkWin(st);
    return true;
  }

  function canTrain(st, cityId, type) {
    const c = st.cities[cityId], p = st.cur;
    if (!c || c.owner !== p || (c.built | 0) >= trainsPerTurn(st, p) + (st.players[p].kind === 'ai' && diffOf(st.players[p]).extraTrain || 0)) return false;
    const U = UNITS[type];
    if (!U || U.hero) return false;
    if (U.faction && U.faction !== fac(st, p)) return false;
    if (U.tech && !hasTech(st, p, U.tech)) return false;
    if (unitAt(st, c.x, c.y)) return false;
    if (unitsOfCity(st, c) >= cityCap(c)) return false;
    return st.players[p].scrap >= unitCost(st, p, type);
  }
  function train(st, cityId, type) {
    if (!canTrain(st, cityId, type)) return false;
    const c = st.cities[cityId];
    const P = st.players[st.cur];
    P.scrap -= unitCost(st, st.cur, type);
    c.built = (c.built | 0) + 1;
    P.stats.trained[type] = (P.stats.trained[type] || 0) + 1;
    const nu = spawn(st, st.cur, type, c.x, c.y, c.id);
    event(st, { k: 'train', x: c.x, y: c.y, type, id: nu.id });
    return true;
  }
  const CITY_REWARDS = {
    2: [{ k: 'scrap', n: 5, name: 'Botín', icon: 'scrap', desc: '+5 chatarra ahora mismo' }, { k: 'unit', type: 'explorador', name: 'Patrulla', icon: 'explorador', desc: 'Un Motorizado gratis' }],
    3: [{ k: 'wall', name: 'Muralla', icon: 'i_wall', desc: '+40% defensa en esta ciudad' }, { k: 'prod', name: 'Taller', icon: 'i_gear', desc: '+1 chatarra por turno aquí' }],
    4: [{ k: 'vet', name: 'Guardia', icon: 'i_medal', desc: 'Un Rondero veterano gratis' }, { k: 'energy', n: 4, name: 'Reactor', icon: 'i_energy', desc: '+4 energía del Inti' }],
  };
  function cityRewardOptions(level) { return CITY_REWARDS[level] || CITY_REWARDS[4]; }
  function chooseCityReward(st, cityId, i) {
    bind(st);
    const c = st.cities[cityId]; if (!c || c.owner < 0) return false;
    const P = st.players[c.owner];
    if (P.cityReward && P.cityReward.city !== cityId) return false;
    const o = cityRewardOptions(c.level)[i] || cityRewardOptions(c.level)[0];
    if (o.k === 'scrap') P.scrap += o.n;
    if (o.k === 'energy') P.energy = (P.energy || 0) + o.n;
    if (o.k === 'wall') c.wall = true;
    if (o.k === 'prod') c.prod = (c.prod || 0) + 1;
    if (o.k === 'unit' || o.k === 'vet') { const sp = [[c.x, c.y], ...neighbors(c.x, c.y)].find(([x, y]) => !unitAt(st, x, y) && passable(st, 'rondero', c.owner, x, y)); if (sp) { const u = spawn(st, c.owner, o.k === 'vet' ? 'rondero' : o.type, sp[0], sp[1], c.id); if (o.k === 'vet') { u.vet = true; u.rank = 1; u.hp = maxHp(u); } u.moved = false; u.acted = false; } else P.scrap += 4; }
    P.cityReward = null;
    log(st, `${c.name}: ${o.name} (${o.desc}).`);
    event(st, { k: 'reward', x: c.x, y: c.y, p: c.owner, name: o.name });
    return true;
  }
  function upgrade(st, cityId) {
    const c = st.cities[cityId];
    if (!c || c.owner !== st.cur || c.level >= 4) return false;
    const cost = upgradeCost(st, c);
    if (st.players[st.cur].scrap < cost) return false;
    st.players[st.cur].scrap -= cost;
    c.level++;
    event(st, { k: 'upgrade', x: c.x, y: c.y });
    log(st, `${c.name} creció a nivel ${c.level}.`);
    // premio a elegir (estilo Polytopia): dos opciones, una decisión
    const P = st.players[st.cur];
    if (P.kind === 'human') P.cityReward = { city: c.id, level: c.level };
    else chooseCityReward(st, c.id, rng(st) < 0.5 ? 0 : 1);
    return true;
  }
  function research(st, t) {
    if (!canResearch(st, st.cur, t)) return false;
    st.players[st.cur].scrap -= techCost(st, st.cur, t);
    st.players[st.cur].techs.push(t);
    log(st, `${st.players[st.cur].name} desarrolló ${TECHS[t].name}.`);
    event(st, { k: 'tech', p: st.cur, t });
    return true;
  }

  // ---------- diplomacia ----------
  const allyCount = (st, p) => st.players.reduce((n, _, i) => n + (i !== p && allied(st, p, i) ? 1 : 0), 0);
  function canAlly(st, a, b) {
    if (st.mods && st.mods.sinpactos) return false;
    if (st.players[a].horde || st.players[b].horde) return false;
    return a !== b && st.players[a].alive && st.players[b].alive && relation(st, a, b) !== 'alianza'
      && allyCount(st, a) === 0 && allyCount(st, b) === 0;
  }
  function propose(st, from, to, type) {
    if (!canAlly(st, from, to)) return false;
    if (st.offers.some((o) => o.from === from && o.to === to)) return false;
    st.offers.push({ from, to, type: type || 'alianza', turn: st.turn });
    return true;
  }
  function answer(st, from, to, accept) {
    st.offers = st.offers.filter((o) => !(o.from === from && o.to === to));
    if (accept && !canAlly(st, from, to)) accept = false;
    if (accept) {
      st.rel[relKey(from, to)] = 'alianza';
      log(st, `Alianza: ${st.players[from].name} y ${st.players[to].name} se dan la mano.`);
      event(st, { k: 'ally', a: from, b: to });
      reveal(st, from); reveal(st, to);
    } else log(st, `${st.players[to].name} rechazó la alianza de ${st.players[from].name}.`);
    checkWin(st);
  }
  // la IA decide si acepta una alianza propuesta por p
  function aiAccepts(st, p, q) {
    const trust = st.players[p].traitor === 0;
    const ratio = power(st, p) / Math.max(1, power(st, q));
    const emb = hasTech(st, p, 'embajada');
    return trust && (ratio > (emb ? 0.45 : 0.6) || rng(st) < (emb ? 0.6 : 0.4)) && (st.players.length > 2 || rng(st) < 0.45);
  }
  function betray(st, p, q) {
    if (relation(st, p, q) !== 'alianza') return false;
    st.rel[relKey(p, q)] = 'guerra';
    st.players[p].traitor = hasTech(st, p, 'embajada') ? 3 : 6;
    st.players[p].betrayed = q;
    st.players[p].stats.betrayals++;
    log(st, `¡TRAICIÓN! ${st.players[p].name} rompió su alianza con ${st.players[q].name}.`);
    event(st, { k: 'betray', a: p, b: q });
    return true;
  }
  function tribute(st, p, q, n) {
    if (st.players[p].scrap < n) return false;
    st.players[p].scrap -= n; st.players[q].scrap += n;
    log(st, `${st.players[p].name} envió ${n} de chatarra a ${st.players[q].name}.`);
    return true;
  }

  // ---------- turnos ----------
  // ---------- misiones secundarias (encargos cortos con premio, solo para humanos en partida libre u online) ----------
  const MISSION_KINDS = ['capture', 'kill', 'build', 'node', 'train', 'tech', 'hold'];
  function missionSnapshot(st, p) { const P = st.players[p]; return { kills: P.kills, captures: P.stats.captures, builds: P.stats.builds || 0, trained: Object.values(P.stats.trained || {}).reduce((a, b) => a + b, 0), techs: P.techs.length }; }
  function newMission(st, p) {
    const P = st.players[p];
    const kinds = MISSION_KINDS.filter((k) => k !== (P.lastMission || ''));
    for (let tries = 0; tries < 8; tries++) {
      const kind = pick(st, kinds), snap = missionSnapshot(st, p), due = st.turn + 7;
      if (kind === 'capture') {
        const mine = st.cities.filter((c) => c.owner === p); if (!mine.length) continue;
        const cand = st.cities.filter((c) => c.owner !== p && !(c.owner >= 0 && allied(st, p, c.owner)) && mine.some((m) => dist(m.x, m.y, c.x, c.y) <= 5));
        if (!cand.length) continue; const c = pick(st, cand);
        return { kind, text: `Toma ${c.name}`, city: c.id, due, reward: 8 + c.level * 2, snap };
      }
      if (kind === 'kill') return { kind, text: 'Destruye 3 unidades enemigas', n: 3, due, reward: 9, snap };
      if (kind === 'build') return { kind, text: 'Levanta una construcción (cultivo, mina…)', n: 1, due, reward: 6, snap };
      if (kind === 'node') { if (!(st.nodes || []).length) continue; return { kind, text: 'Termina un turno sobre un nodo del Inti', due, reward: 7, snap }; }
      if (kind === 'train') return { kind, text: 'Entrena 3 tropas', n: 3, due, reward: 6, snap };
      if (kind === 'tech') return { kind, text: 'Investiga 2 tecnologías', n: 2, due, reward: 7, snap };
      if (kind === 'hold') { const mine = st.cities.filter((c) => c.owner === p && !c.capital); if (!mine.length) continue; const c = pick(st, mine); return { kind, text: `Conserva ${c.name} hasta el turno ${due}`, city: c.id, due, reward: 6, snap }; }
    }
    return null;
  }
  function missionProgress(st, p) {
    const P = st.players[p], m = P.mission; if (!m) return null;
    const now = missionSnapshot(st, p);
    if (m.kind === 'capture') return { cur: st.cities[m.city].owner === p ? 1 : 0, n: 1 };
    if (m.kind === 'kill') return { cur: Math.min(m.n, now.kills - m.snap.kills), n: m.n };
    if (m.kind === 'build') return { cur: Math.min(1, now.builds - m.snap.builds), n: 1 };
    if (m.kind === 'node') return { cur: (st.nodes || []).some((nd) => nd.owner === p && st.units.some((u) => u.owner === p && u.x === nd.x && u.y === nd.y)) ? 1 : 0, n: 1 };
    if (m.kind === 'train') return { cur: Math.min(m.n, now.trained - m.snap.trained), n: m.n };
    if (m.kind === 'tech') return { cur: Math.min(m.n, now.techs - m.snap.techs), n: m.n };
    if (m.kind === 'hold') return { cur: st.turn >= m.due && st.cities[m.city].owner === p ? 1 : 0, n: 1, lost: st.cities[m.city].owner !== p };
    return null;
  }
  function checkMissions(st, p) {
    const P = st.players[p];
    if (P.kind !== 'human' || P.horde || st.mode === 'campaign' || st.mode === 'coop' || (st.mods && st.mods.sincartas)) return;
    if (P.mission) {
      const pr = missionProgress(st, p);
      if (pr && pr.cur >= pr.n && !pr.lost) { P.scrap += P.mission.reward; P.stats.missions = (P.stats.missions || 0) + 1; log(st, `Misión cumplida: ${P.mission.text}. +${P.mission.reward} chatarra.`); event(st, { k: 'mission', p, state: 'done', text: P.mission.text, reward: P.mission.reward }); P.lastMission = P.mission.kind; P.mission = null; P.missionCd = 2; }
      else if (st.turn > P.mission.due || (pr && pr.lost)) { log(st, `Misión fallida: ${P.mission.text}.`); event(st, { k: 'mission', p, state: 'fail', text: P.mission.text }); P.lastMission = P.mission.kind; P.mission = null; P.missionCd = 2; }
    }
    if (!P.mission) {
      if (P.missionCd > 0) { P.missionCd--; return; }
      if (st.turn < 3) return;
      const m = newMission(st, p); if (m) { P.mission = m; event(st, { k: 'mission', p, state: 'new', text: m.text, reward: m.reward, due: m.due }); }
    }
  }
  function startTurn(st) {
    const p = st.cur, P = st.players[p];
    checkMissions(st, p);
    P.scrap += income(st, p);
    P.energy = (P.energy || 0) + energyIncome(st, p);
    P.usedPower = false;
    if (P.reveal > 0) P.reveal--;
    drawCard(st, p);
    if (P.traitor > 0) P.traitor--;
    if (P.moral > 0) P.moral--;
    for (const u of st.units) if (u.owner === p && u.hero && u.cd > 0) u.cd--;
    for (const u of st.units) if (u.owner === p) { u.moved = false; u.acted = false; if (u.guard && enemiesNear(st, p, u.x, u.y, 2).length) { u.guard = false; event(st, { k: 'wake', x: u.x, y: u.y, p }); } }
    for (const c of st.cities) if (c.owner === p) c.built = 0;
    reveal(st, p);
  }

  function endTurn(st) {
    bind(st);
